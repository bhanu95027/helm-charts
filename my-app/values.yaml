# Default values for my-app.
replicaCount: 2

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/devops-sample-app # Replace with your ECR URL
  pullPolicy: Always
  tag: "latest" # Overwritten dynamically by app-code CI pipeline

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /
  initialDelaySeconds: 15
  periodSeconds: 10
